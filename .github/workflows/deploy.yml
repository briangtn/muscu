name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /muscu/
      # GitHub Pages renvoie 404.html pour les URL inconnues : on y sert l'app pour que le routeur prenne le relais.
      - run: cp dist/muscu/browser/index.html dist/muscu/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/muscu/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
