<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d55" />
      <stop offset="0.55" stop-color="#ff5e3a" />
      <stop offset="1" stop-color="#ff9500" />
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#7a1020" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />
  <rect width="512" height="512" fill="url(#glow)" />

  <!-- Haltère blanche, légèrement inclinée, dans la zone sûre des icônes masquées -->
  <g transform="rotate(-30 256 256)" fill="#ffffff" filter="url(#shadow)">
    <rect x="160" y="238" width="192" height="36" rx="18" />
    <rect x="128" y="168" width="48" height="176" rx="20" />
    <rect x="82" y="198" width="40" height="116" rx="18" />
    <rect x="336" y="168" width="48" height="176" rx="20" />
    <rect x="390" y="198" width="40" height="116" rx="18" />
  </g>
</svg>
